buildscript {
    ext.kotlinVersion = "2.2.20"

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.13.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        classpath("de.mannodermaus.gradle.plugins:android-junit5:1.13.4.0")
        classpath("com.adarshr:gradle-test-logger-plugin:4.0.0")
        classpath("info.solidsoft.gradle.pitest:gradle-pitest-plugin:1.15.0")
    }
}

plugins {
    id("com.github.ben-manes.versions") version "0.52.0"
    id("io.spring.dependency-management") version "1.1.7"
}

allprojects {
    apply from: "$rootDir/.ops/git.gradle"
    // Use git-based versioning for all modules
    version = git.versionName()
}

subprojects {
    repositories {
        google()
        mavenCentral()
    }

    project.apply from: "$rootDir/dependencies.gradle"

    afterEvaluate { project ->
        tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).all {
            kotlinOptions {
                freeCompilerArgs += ["-progressive"]
                // Ensure all Kotlin compile tasks (including tests) target JVM 17
                jvmTarget = "17"
            }
        }

        if (plugins.hasPlugin("kotlin")) {
            java {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }

            compileKotlin {
                kotlinOptions {
                    jvmTarget = "17"
                }
            }
        }

        if (plugins.hasPlugin("com.android.library") || plugins.hasPlugin("com.android.application")) {
            java {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }

            android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }

                compileSdkVersion(36)
                defaultConfig {
                    targetSdkVersion(36)

                    versionName = git.versionName()
                    versionCode = git.commitCount()

                    testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
                }

                testOptions {
                    unitTests.returnDefaultValues = true
                }

                lintOptions {
                    warningsAsErrors = true
                    textReport = true

                    ignoreTestSources true

                    ignore "ObsoleteLintCustomCheck", "GradleDependency"
                }
            }
        }

        if (project.name != "docs" && (project.hasProperty("test") || project.hasProperty("android"))) {
            project.apply from: "$rootDir/.ops/testing.gradle"
            project.apply from: "$rootDir/.ops/pitest.gradle"
        }

        // Apply publishing configuration for modules that define Maven coordinates
        if (project.hasProperty("groupId") && project.hasProperty("artifactId")) {
            project.apply from: "$rootDir/.ops/publishing.gradle"
        }
    }
}

println("Version ${git.versionName()}")
