[versions]
kotlin = "2.2.20"
androidx-annotation = "1.9.1"
appcompat = "1.7.1"
interpolator = "1.0.0"
rxjava2 = "2.2.21"
rxkotlin2 = "2.4.0"
timber = "5.0.1"
lifecycle-runtime = "2.9.3"
core-ktx = "1.17.0"
material = "1.13.0"
constraintlayout = "2.2.1"
rxandroid2 = "2.1.1"
picasso = "2.71828"
konfetti = "1.3.2"
rxbinding3 = "3.1.0"
sqlbrite3 = "3.2.0"
arch-persistence-db = "1.1.1"
expectkt = "1.0.1"
mockito-kotlin = "6.0.0"
junit-jupiter = "5.13.4"
junit4 = "4.13.2"
espresso = "3.7.0"
androidx-test = "1.7.0"
uiautomator = "2.3.0"
android-tools = "30.0.1"
android-gradle = "8.13.0"
kotlin-plugin = "2.2.20"
pitest-core = "1.4.9"
pitest-junit5-plugin = "0.14"
android-junit5-plugin = "1.13.4.0"
test-logger-plugin = "4.0.0"
gradle-pitest-plugin = "1.15.0"

[libraries]
# Kotlin
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-stdlib-jdk7 = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk7", version.ref = "kotlin" }
kotlin-stdlib-jdk8 = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }

# Core
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidx-annotation" }

# ext-acorn-android
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-interpolator = { module = "androidx.interpolator:interpolator", version.ref = "interpolator" }

# ext-acorn-rx
rxjava2 = { module = "io.reactivex.rxjava2:rxjava", version.ref = "rxjava2" }
rxkotlin2 = { module = "io.reactivex.rxjava2:rxkotlin", version.ref = "rxkotlin2" }

# ext-acorn-android-timber
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }

# ext-acorn-android-lifecycle
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime", version.ref = "lifecycle-runtime" }

# "Hello" sample apps
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
rxandroid2 = { module = "io.reactivex.rxjava2:rxandroid", version.ref = "rxandroid2" }
picasso = { module = "com.squareup.picasso:picasso", version.ref = "picasso" }
konfetti = { module = "nl.dionsegijn:konfetti", version.ref = "konfetti" }

# Notes app
rxbinding3 = { module = "com.jakewharton.rxbinding3:rxbinding", version.ref = "rxbinding3" }
rxbinding3-appcompat = { module = "com.jakewharton.rxbinding3:rxbinding-appcompat", version.ref = "rxbinding3" }
sqlbrite3-kotlin = { module = "com.squareup.sqlbrite3:sqlbrite-kotlin", version.ref = "sqlbrite3" }
arch-persistence-db-framework = { module = "android.arch.persistence:db-framework", version.ref = "arch-persistence-db" }

# Testing & checks
expectkt = { module = "com.nhaarman:expect.kt", version.ref = "expectkt" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockito-kotlin" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit-jupiter" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit-jupiter" }
pitest-junit5 = { module = "org.pitest:pitest-junit5-plugin", version.ref = "pitest-junit5-plugin" }

androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
androidx-espresso-contrib = { module = "androidx.test.espresso:espresso-contrib", version.ref = "espresso" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidx-test" }
uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }

# JUnit 4
junit4 = { module = "junit:junit", version.ref = "junit4" }

# Android tools / lint
android-lint = { module = "com.android.tools.lint:lint", version.ref = "android-tools" }
android-lint-api = { module = "com.android.tools.lint:lint-api", version.ref = "android-tools" }
android-lint-checks = { module = "com.android.tools.lint:lint-checks", version.ref = "android-tools" }
android-lint-tests = { module = "com.android.tools.lint:lint-tests", version.ref = "android-tools" }

[bundles]
junit-jupiter = ["junit-jupiter-api", "junit-jupiter-engine"]
espresso = ["androidx-espresso-core", "androidx-espresso-contrib", "androidx-test-runner", "androidx-test-rules"]

[plugins]
android-application = { id = "com.android.application", version.ref = "android-gradle" }
android-library = { id = "com.android.library", version.ref = "android-gradle" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin-plugin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin-plugin" }
ben-manes-versions = { id = "com.github.ben-manes.versions", version = "0.52.0" }
android-junit5 = { id = "de.mannodermaus.android-junit5", version.ref = "android-junit5-plugin" }
test-logger = { id = "com.adarshr.test-logger", version.ref = "test-logger-plugin" }
pitest = { id = "info.solidsoft.pitest", version.ref = "gradle-pitest-plugin" }
